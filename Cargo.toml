[package]
name = "LogerApiFork"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-modbus = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio", "macros"] }
toml = "1.1.0"
colored = "3.1.1"
chrono = "0.4.44"
tower-http = { version = "0.7", features = ["cors"] }
chacha20poly1305 = "0.11.0-rc.3"
aead = "0.6.1"
base64 = "0.22.1"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
uuid = { version = "1.23.4", features = ["v4"] }
[build-dependencies]
tower-http = { version = "0.6", features = ["fs"] }